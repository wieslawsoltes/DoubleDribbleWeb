name: Import verified game source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import.yml', '.github/import/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify and extract the source package
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          parts = sorted(Path('.github/import').glob('part*.b64'))
          assert len(parts) == 6, 'Expected six source parts'
          data = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'cfc25cf6164d9102f95a2758ef6bdf431e8d2afe89aa53745c0c55b9bbd8071d', 'Source checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == 27, 'Unexpected source file count'
              for member in members:
                  path = Path(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert '.github' not in path.parts, 'Workflows are managed separately'
              archive.extractall('.', filter='data')
          print('Verified and extracted all 27 source files.')
          PY
      - name: Run unit tests and build standalone game
        run: npm run check
      - name: Run Chromium integration tests and regenerate previews
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          source "$RUNNER_TEMP/browser-venv/bin/activate"
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Commit the complete project and remove transfer files
        run: |
          rm -rf .github/import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "feat: import complete browser game, tests, documentation and standalone builds"
          git push origin HEAD:main
          printf '## Source import complete\n\nCommit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
